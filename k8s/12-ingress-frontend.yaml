# No host set: the frontend now proxies all backend calls server-side
# (see frontend/app/api/*/route.ts), so nothing needs to know the cluster's
# external IP ahead of time. A hostless rule matches any incoming Host header,
# so this works unchanged no matter how often the cluster/LB IP changes.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ingress
  namespace: user-mgmt
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
