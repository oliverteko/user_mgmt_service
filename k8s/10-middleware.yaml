# Requires the Traefik CRDs to be installed in the cluster (see k8s/README.md).
# Replicates the docker-compose label:
#   traefik.http.middlewares.strip-api.stripprefix.prefixes=/api
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-api-prefix
  namespace: user-mgmt
spec:
  stripPrefix:
    prefixes:
      - /api
