# Split into its own Ingress object (separate from the frontend Ingress) because
# the router.middlewares annotation applies to the whole Ingress object - there's
# no way to attach strip-api-prefix to only the /api rule within a single object.
#
# host: DigitalOcean Load Balancer IP as an sslip.io hostname (no DNS setup
# needed - sslip.io resolves "<ip>.sslip.io" to <ip> automatically). This is a
# placeholder until the Traefik LoadBalancer Service exists and its external
# IP is known - see the "DigitalOcean" section in k8s/README.md for the
# one-time bootstrap. Must be kept in sync with NEXT_PUBLIC_API_URL in
# .github/workflows/build-and-push.yml and with 12-ingress-frontend.yaml.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-ingress
  namespace: user-mgmt
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: user-mgmt-strip-api-prefix@kubernetescrd
    traefik.ingress.kubernetes.io/router.priority: "10"
spec:
  ingressClassName: traefik
  rules:
    - host: REPLACE-WITH-LB-IP.sslip.io
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
