name: Bootstrap ArgoCD on DOKS

on:
  workflow_dispatch:

env:
  OPS_REPO_RAW_BASE: https://raw.githubusercontent.com/oliverteko/user-mgmt-service-ops/main/argocd

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Save DOKS kubeconfig
        run: doctl kubernetes cluster kubeconfig save "${{ vars.DO_CLUSTER_NAME }}"

      # A freshly (re)created cluster can accept the kubeconfig and answer
      # reads before its control plane is fully stable, causing writes
      # (e.g. the Secret creation below) to fail with "unexpected EOF".
      # Wait for all nodes to report Ready before doing anything else.
      - name: Wait for cluster readiness
        run: |
          for i in $(seq 1 30); do
            node_count=$(kubectl get nodes --no-headers 2>/dev/null | wc -l)
            ready_count=$(kubectl get nodes --no-headers 2>/dev/null | grep -c " Ready")
            if [ "$node_count" -gt 0 ] && [ "$node_count" = "$ready_count" ]; then
              echo "All $node_count node(s) Ready."
              exit 0
            fi
            echo "Cluster not ready yet, retrying in 10s..."
            sleep 10
          done
          echo "Cluster did not become ready in time" >&2
          exit 1

      - name: Set up Helm
        uses: azure/setup-helm@v4

      # Idempotent: installs Traefik (the Ingress controller + its LoadBalancer
      # Service) on a freshly (re)created cluster, no-ops if already present.
      # Cluster-level infra, unrelated to app releases - lives here rather
      # than in build-and-push.yml, which now only builds/pushes images.
      - name: Install/upgrade Traefik
        run: |
          helm repo add traefik https://traefik.github.io/charts
          helm repo update
          helm upgrade --install traefik traefik/traefik -n traefik --create-namespace

      # ArgoCD lives in its own namespace, separate from the user-mgmt-service
      # namespace it manages. Idempotent - safe to re-run after a cluster
      # recreation or to pick up a newer ArgoCD version.
      - name: Install/upgrade ArgoCD
        run: |
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update
          helm upgrade --install argocd argo/argo-cd -n argocd --create-namespace

      # The backend HorizontalPodAutoscaler (prod) needs CPU metrics, which
      # DOKS doesn't ship by default. Idempotent, like the installs above.
      - name: Install/upgrade metrics-server
        run: |
          helm repo add metrics-server https://kubernetes-sigs.github.io/metrics-server/
          helm repo update
          helm upgrade --install metrics-server metrics-server/metrics-server -n kube-system

      # app-secret is deliberately kept out of the ops repo / ArgoCD's control
      # (both Application manifests set secret.create=false) - real
      # credentials never enter git, only this idempotent upsert from GitHub
      # Secrets. staging and prod are independent namespaces, each needs its
      # own copy of the secret.
      - name: Ensure namespaces and app-secret (staging + prod)
        run: |
          for ns in user-mgmt-staging user-mgmt-prod; do
            kubectl create namespace "$ns" --dry-run=client -o yaml | kubectl apply -f -
            kubectl create secret generic app-secret -n "$ns" \
              --from-literal=DB_USERNAME=postgres \
              --from-literal=DB_PASSWORD="${{ secrets.SPRING_DATASOURCE_PASSWORD }}" \
              --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              --dry-run=client -o yaml | kubectl apply -f -
          done

      # From here on, ArgoCD owns both environments: it continuously syncs
      # each namespace with helm/user-mgmt-service (values-staging.yaml /
      # values-prod.yaml) in the ops repo. No more kubectl apply/set image
      # against app resources.
      - name: Apply ArgoCD Applications
        run: |
          kubectl apply -f "${{ env.OPS_REPO_RAW_BASE }}/application-staging.yaml"
          kubectl apply -f "${{ env.OPS_REPO_RAW_BASE }}/application-prod.yaml"
