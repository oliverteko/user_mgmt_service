name: Build and Push to GHCR

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "build.gradle"
      - "settings.gradle"
      - "dockerfile"
      - "frontend/**"
      - ".github/workflows/build-and-push.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/user-mgmt-service-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/user-mgmt-service-frontend

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Save DOKS kubeconfig
        run: doctl kubernetes cluster kubeconfig save "${{ vars.DO_CLUSTER_NAME }}"

      - name: Set up Helm
        uses: azure/setup-helm@v4

      # Idempotent: installs Traefik (the Ingress controller + its LoadBalancer
      # Service) on a freshly (re)created cluster, no-ops if already present.
      # Runs on every deploy so the cluster never needs manual bootstrapping.
      - name: Install/upgrade Traefik
        run: |
          helm repo add traefik https://traefik.github.io/charts
          helm repo update
          helm upgrade --install traefik traefik/traefik -n traefik --create-namespace

      - name: Apply namespace
        run: kubectl apply -f k8s/00-namespace.yaml

      # Idempotent upsert: recreates app-secret from GitHub Secrets on every
      # deploy, so a freshly (re)created cluster never needs a manual
      # `kubectl create secret` step. Values never appear in git, only here.
      # Reuses the same JWT_SECRET / SPRING_DATASOURCE_PASSWORD secrets
      # already used by the Azure deploy path (deploy.yml) - same backend,
      # same values, no need for separate DOKS-only secrets.
      - name: Upsert app-secret
        run: |
          kubectl create secret generic app-secret -n user-mgmt \
            --from-literal=DB_USERNAME=postgres \
            --from-literal=DB_PASSWORD="${{ secrets.SPRING_DATASOURCE_PASSWORD }}" \
            --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply manifests
        run: |
          kubectl apply -f k8s/01-configmap.yaml
          kubectl apply -f k8s/03-postgres-pvc.yaml
          kubectl apply -f k8s/04-postgres-deployment.yaml
          kubectl apply -f k8s/05-postgres-service.yaml
          kubectl apply -f k8s/06-backend-deployment.yaml
          kubectl apply -f k8s/07-backend-service.yaml
          kubectl apply -f k8s/08-frontend-deployment.yaml
          kubectl apply -f k8s/09-frontend-service.yaml
          kubectl apply -f k8s/12-ingress-frontend.yaml

      # pins the rollout to the image just built (rather than relying on
      # :latest + pull policy), which reliably triggers a rolling update
      - name: Roll out new images
        run: |
          kubectl set image deployment/backend backend=${{ env.BACKEND_IMAGE }}:${{ github.sha }} -n user-mgmt
          kubectl set image deployment/frontend frontend=${{ env.FRONTEND_IMAGE }}:${{ github.sha }} -n user-mgmt
          kubectl rollout status deployment/backend -n user-mgmt
          kubectl rollout status deployment/frontend -n user-mgmt
