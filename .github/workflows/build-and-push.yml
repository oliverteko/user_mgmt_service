name: Build and Push to GHCR

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "build.gradle"
      - "settings.gradle"
      - "dockerfile"
      - "frontend/**"
      - ".github/workflows/build-and-push.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/user-mgmt-service-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/user-mgmt-service-frontend

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

  promote:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      # Cross-repo push, so the repo-scoped GITHUB_TOKEN can't be used here -
      # OPS_REPO_TOKEN is a PAT with contents:write on user-mgmt-service-ops.
      - name: Checkout ops repo
        uses: actions/checkout@v4
        with:
          repository: oliverteko/user-mgmt-service-ops
          token: ${{ secrets.OPS_REPO_TOKEN }}

      # yq is preinstalled on GitHub-hosted ubuntu runners.
      - name: Bump image tags in values.yaml
        run: |
          yq -i '.backend.image.tag = "${{ github.sha }}"' helm/user-mgmt-service/values.yaml
          yq -i '.frontend.image.tag = "${{ github.sha }}"' helm/user-mgmt-service/values.yaml

      # ArgoCD's automated sync picks this commit up and rolls the new
      # images out - no direct cluster access from this pipeline anymore.
      - name: Commit and push promotion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/user-mgmt-service/values.yaml
          git commit -m "Promote image tag to ${{ github.sha }}" || echo "Nothing to promote"
          git push
