spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# The audit users of every entity (created_by / last_modified_by, eager @ManyToOne) were joined
# into each entity query, recursively, together with every level's eager roles and authorities -
# one select with dozens of self-joins that PostgreSQL spent seconds just planning, on every
# authenticated request (the JWT filter loads the user). With fetch depth 0 each association is
# loaded by its own small select instead. Same fix as in the reference solution
# (beatos-learns/VSC-kubernetes-containers, 0004-audit-fetch-depth.patch).
spring.jpa.properties.hibernate.max_fetch_depth=0

jwt.issuer=${JWT_ISSUER}
jwt.secret=${JWT_SECRET}
jwt.expiration-millis=${JWT_EXPIRATION_MILLIS}

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=user-mgmt-service

# module_service (REST, via its Kubernetes Service) - see ModuleServiceProperties for all
# timeout/retry/circuit breaker settings and their defaults
module-service.base-url=${MODULE_SERVICE_URL:http://module-service:8080}
